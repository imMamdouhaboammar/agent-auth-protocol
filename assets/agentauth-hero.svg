<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentAuth identity flow</title>
  <desc id="desc">A dark technical network showing a represented subject, an AI agent principal, a running agent instance, and a provider connected by explicit identity, delegation, and proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0b1023"/>
      <stop offset="1" stop-color="#160b2d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".5" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#ff9f5a"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="34" fill="url(#grid)"/>
  <circle cx="620" cy="300" r="300" fill="url(#glowA)"/>
  <circle cx="1010" cy="290" r="260" fill="url(#glowB)"/>

  <g opacity=".7" filter="url(#softGlow)">
    <path d="M330 310 C470 310 470 248 610 248 S770 310 860 310 S1040 250 1180 250 S1270 310 1390 310" fill="none" stroke="#2f81f7" stroke-width="8"/>
    <path d="M330 332 C500 332 500 382 650 382 S820 330 930 330 S1080 390 1240 390" fill="none" stroke="#8b5cf6" stroke-width="7"/>
  </g>

  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
    <path d="M300 310 C420 310 470 260 590 260"/>
    <path d="M740 260 C820 260 850 310 930 310"/>
    <path d="M1060 310 C1170 310 1210 270 1320 270"/>
    <path d="M690 330 C760 390 860 405 960 405"/>
    <path d="M1040 405 C1140 405 1220 350 1320 350"/>
  </g>

  <g fill="#58a6ff">
    <circle cx="416" cy="292" r="6"/>
    <circle cx="846" cy="294" r="6"/>
    <circle cx="1190" cy="296" r="6"/>
  </g>
  <g fill="#8b5cf6">
    <circle cx="800" cy="393" r="6"/>
    <circle cx="1160" cy="390" r="6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="220" width="220" height="180" rx="28" fill="#0f1d33" stroke="#3a547a" stroke-width="1.5"/>
    <circle cx="225" cy="278" r="32" fill="#142a49" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="225" cy="266" r="9" fill="none" stroke="#d7e7ff" stroke-width="3"/>
    <path d="M207 296 C214 283 236 283 243 296" fill="none" stroke="#d7e7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="225" y="344" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">SUBJECT</text>
    <text x="225" y="371" fill="#94a8c7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">who is represented</text>

    <rect x="555" y="180" width="245" height="220" rx="34" fill="#111936" stroke="#536dff" stroke-width="1.7"/>
    <circle cx="677" cy="255" r="54" fill="url(#agent)" opacity=".95"/>
    <path d="M645 257 L665 236 L689 258 L709 238" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="645" cy="257" r="5" fill="#fff"/>
    <circle cx="665" cy="236" r="5" fill="#fff"/>
    <circle cx="689" cy="258" r="5" fill="#fff"/>
    <circle cx="709" cy="238" r="5" fill="#fff"/>
    <text x="677" y="337" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">AGENT PRINCIPAL</text>
    <text x="677" y="367" fill="#9fb1d0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">durable AI security identity</text>

    <rect x="900" y="245" width="190" height="145" rx="26" fill="#15152f" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect x="949" y="278" width="92" height="60" rx="14" fill="#241f50"/>
    <path d="M972 321 L972 295 M994 321 L994 295 M1016 321 L1016 295" stroke="#c2b6ff" stroke-width="4" stroke-linecap="round"/>
    <text x="995" y="355" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">INSTANCE</text>
    <text x="995" y="378" fill="#a99fe0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">proof-bound runtime</text>

    <rect x="1300" y="195" width="220" height="220" rx="32" fill="#1b1728" stroke="#cc7d45" stroke-width="1.6"/>
    <path d="M1380 270 L1410 248 L1440 270 L1430 315 C1425 337 1410 349 1410 349 C1410 349 1395 337 1390 315 Z" fill="#2f2233" stroke="#ff9f5a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1399 299 L1408 308 L1424 287" fill="none" stroke="#ffd2b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1410" y="364" fill="#ffffff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">PROVIDER</text>
    <text x="1410" y="390" fill="#c6a994" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">verifies actor + authority</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
    <text x="430" y="238" fill="#78b7ff">DELEGATION</text>
    <text x="816" y="250" fill="#a699ff">IDENTITY + PROOF</text>
    <text x="1118" y="246" fill="#f4a66d">LOCAL POLICY</text>
  </g>

  <g transform="translate(682 462)">
    <rect x="-220" y="0" width="440" height="78" rx="22" fill="#0e1729" stroke="#304666"/>
    <text x="0" y="30" text-anchor="middle" fill="#f8fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Subject ≠ Agent ≠ Instance</text>
    <text x="0" y="56" text-anchor="middle" fill="#8297b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Authority stays explicit all the way to the provider</text>
  </g>

  <g opacity=".65">
    <circle cx="93" cy="90" r="3" fill="#58a6ff"/>
    <circle cx="1480" cy="84" r="3" fill="#8b5cf6"/>
    <circle cx="1510" cy="530" r="3" fill="#ff9f5a"/>
    <circle cx="92" cy="536" r="3" fill="#8b5cf6"/>
  </g>
</svg>
