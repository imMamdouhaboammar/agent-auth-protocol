name: Publish Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "CITATION.cff"
      - "ATTRIBUTION.md"
      - "HOW_TO_CITE.md"
      - "DESIGN_PROVENANCE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "agentauth-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh api "repos/${GH_REPO}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GitHub Pages is not enabled for this repository. Enable Pages with GitHub Actions as the source, then rerun this workflow."
          fi

      - name: Checkout
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Configure Pages
        if: steps.pages_state.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation with Jekyll
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
