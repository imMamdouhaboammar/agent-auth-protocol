name: Publish Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "CITATION.cff"
      - "ATTRIBUTION.md"
      - "HOW_TO_CITE.md"
      - "DESIGN_PROVENANCE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "agentauth-pages"
  cancel-in-progress: false

jobs:
  check_pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          pages_response="$(gh api --include "repos/${GH_REPO}/pages" 2>&1)"
          api_exit=$?
          set -e

          if [ "$api_exit" -eq 0 ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif printf '%s\n' "$pages_response" | grep -Eq '^HTTP/[0-9.]+ 404'; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GitHub Pages is not enabled for this repository. Enable Pages in Settings > Pages with GitHub Actions as the source, then rerun this workflow."
          else
            printf '%s\n' "$pages_response" >&2
            exit "$api_exit"
          fi

  publish:
    needs: check_pages
    if: needs.check_pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage machine-readable discovery files
        shell: bash
        run: |
          cp llms.txt docs/llms.txt
          cp llms-full.txt docs/llms-full.txt
          cp CITATION.cff docs/CITATION.cff

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
